[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunebridge"
version = "0.1.0"
description = "Turn Deezer and TIDAL links into songs you can play from YouTube or SoundCloud with Lavalink."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "qizox" }]
dependencies = ["aiohttp>=3.9"]
keywords = ["discord", "lavalink", "music", "deezer", "tidal", "isrc"]
classifiers = [
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/qizox/tunebridge"

[tool.hatch.build.targets.wheel]
packages = ["src/tunebridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
